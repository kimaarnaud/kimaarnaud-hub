# Sur le VPS : /srv/hub/docker-compose.yml
services:
  hub:
    image: ghcr.io/kimaarnaud/kimaarnaud-hub:latest
    restart: unless-stopped
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.hub.rule=Host(`kimaarnaud.com`) || Host(`www.kimaarnaud.com`)
      - traefik.http.routers.hub.entrypoints=websecure
      - traefik.http.routers.hub.middlewares=hub-www,hub-secure
      - traefik.http.services.hub.loadbalancer.server.port=80
      - traefik.http.middlewares.hub-www.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.hub-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.hub-www.redirectregex.permanent=true
      - traefik.http.middlewares.hub-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.hub-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.hub-secure.headers.frameDeny=true

networks:
  proxy:
    external: true
